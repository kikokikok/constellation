# Docker Compose for Constellation with Iggy
# For local development and testing

version: '3.8'

services:
  # Iggy message broker server
  iggy-server:
    image: iggyrs/iggy:latest
    container_name: constellation-iggy
    ports:
      - "8090:8090"  # Iggy server port
      - "3000:3000"  # Iggy HTTP API
    environment:
      - IGGY_SYSTEM_PATH=./data
      - IGGY_QUIC_DATAGRAM_SEND_BUFFER_SIZE=65536
      - IGGY_QUIC_DATAGRAM_RECEIVE_BUFFER_SIZE=65536
      - IGGY_SERVER_ADDRESS=0.0.0.0:8090
      - IGGY_HTTP_ENABLED=true
      - IGGY_HTTP_ADDRESS=0.0.0.0:3000
    volumes:
      - iggy-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - constellation-network

  # Constellation application
  constellation-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: constellation-app
    ports:
      - "8080:8080"
    environment:
      - IGGY_SERVER_ADDRESS=iggy-server:8090
      - IGGY_USERNAME=guest
      - IGGY_PASSWORD=guest
      - RUST_LOG=info
      - CONSTELLATION_ENV=production
    depends_on:
      iggy-server:
        condition: service_healthy
    volumes:
      - ./config:/etc/constellation:ro
      - ./logs:/var/log/constellation
    networks:
      - constellation-network
    command: ["http_server_example"]

  # Optional: PostgreSQL for additional persistence (if needed)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: constellation-postgres
  #   environment:
  #     POSTGRES_DB: constellation
  #     POSTGRES_USER: constellation
  #     POSTGRES_PASSWORD: constellation123
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - constellation-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: constellation-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - constellation-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: constellation-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - constellation-network

volumes:
  iggy-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  constellation-network:
    driver: bridge