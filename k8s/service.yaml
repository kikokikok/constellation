apiVersion: v1
kind: Service
metadata:
  name: constellation
  namespace: constellation
  labels:
    app: constellation
spec:
  selector:
    app: constellation
  ports:
  - name: http-api
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: health
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP