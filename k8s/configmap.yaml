apiVersion: v1
kind: ConfigMap
metadata:
  name: constellation-config
  namespace: constellation
data:
  # Server configuration
  RUST_LOG: "info,constellation_core=debug"
  DATABASE_URL: "postgres://constellation:password@postgres.constellation.svc.cluster.local:5432/constellation"
  REDIS_URL: "redis://redis.constellation.svc.cluster.local:6379"
  
  # Message broker configuration
  MESSAGE_BROKER_TYPE: "iggy"
  IGGY_SERVER_URL: "tcp://iggy.constellation.svc.cluster.local:8090"
  MAX_QUEUE_SIZE: "10000"
  MESSAGE_TTL_SECONDS: "3600"
  
  # Authentication configuration
  JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  JWT_EXPIRATION_HOURS: "24"
  API_KEY_EXPIRATION_DAYS: "30"
  
  # Monitoring configuration
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_PORT: "8081"