[workspace]
members = [
    "crates/constellation-core",
    "crates/constellation-agent-sdk",
    "crates/constellation-agent-harness",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.48", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
validator = { version = "0.20", features = ["derive"] }
petgraph = "0.8"
dashmap = "7.0.0-rc2"
sm = "0.9"
guard = "0.5"
bytes = "1.11"
secrecy = "0.10"
subtle = "2.6"