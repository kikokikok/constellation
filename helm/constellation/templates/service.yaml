apiVersion: v1
kind: Service
metadata:
  name: {{ include "constellation.fullname" . }}
  labels:
    {{- include "constellation.labels" . | nindent 4 }}
spec:
  type: {{ .Values.global.service.type }}
  ports:
    - port: {{ .Values.global.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.global.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    - port: {{ .Values.global.service.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "constellation.selectorLabels" . | nindent 4 }}