apiVersion: v2
name: constellation
description: A Helm chart for deploying Constellation A2A Message Broker
type: application
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/constellation/constellation
sources:
  - https://github.com/constellation/constellation
maintainers:
  - name: Constellation Team
    email: team@constellation.example.com
    url: https://constellation.example.com
keywords:
  - multi-agent
  - message-broker
  - a2a
  - ai
  - rust
annotations:
  artifacthub.io/prerelease: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/containsSecurityUpdates: "false"
