[package]
name = "constellation-agent-harness"
version = "0.1.0"
edition = "2021"
description = "Long-running agent harness for autonomous software development"
license = "MIT"
authors = ["Constellation Team"]
repository = "https://github.com/constellation/constellation"

[dependencies]
constellation-core = { path = "../constellation-core" }
constellation-agent-sdk = { path = "../constellation-agent-sdk" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
anyhow = { workspace = true }
validator = { workspace = true, features = ["derive"] }
dashmap = { workspace = true }
bytes = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }
log = "0.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.18", features = ["vendored-libgit2"] }
tempfile = "3.10"
walkdir = "2.5"
glob = "0.3"
yaml-rust = "0.4"
toml = "0.8"
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
assert_matches = "1.5"
rstest = "0.19"
