[package]
name = "constellation-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
uuid = { version = "1.10", features = ["serde", "v4"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dryoc = "0.7"
base64 = "0.22"
sha2 = "0.10"
curve25519-dalek = "4.1"
x25519-dalek = { version = "2.0", features = ["static_secrets", "reusable_secrets"] }
rand = "0.9"
regex = "1.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# New optimization crates from workspace
anyhow = { workspace = true }
validator = { workspace = true }
petgraph = { workspace = true }
dashmap = { workspace = true }
sm = { workspace = true }
guard = { workspace = true }
bytes = { workspace = true }
secrecy = { workspace = true }
subtle = { workspace = true }

# libp2p for peer-to-peer networking
libp2p = { version = "0.56.0", features = ["full"] }

# TOON crate for token-efficient serialization (30-60% fewer tokens than JSON)
toon = "0.1.2"

# MessagePack for compact binary serialization
rmp-serde = "1.1"

# Protobuf for type-safe binary serialization
prost = "0.12"
prost-types = "0.12"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[lib]
bench = false

# [[bench]]
# name = "performance_benchmarks"
# harness = false

[[example]]
name = "a2a_agent_example"
path = "../../examples/a2a_agent_example.rs"

[[example]]
name = "dtg_example"
path = "../../examples/dtg_example.rs"

[[example]]
name = "mcp_security_example"
path = "../../examples/mcp_security_example.rs"

[[example]]
name = "hybrid_agent_example"
path = "../../examples/hybrid_agent_example.rs"

[[example]]
name = "open_world_example"
path = "../../examples/open_world_example.rs"

[[example]]
name = "integration_example"
path = "../../examples/integration_example.rs"

[[example]]
name = "dtg_visualization_example"
path = "../../examples/dtg_visualization_example.rs"

[[example]]
name = "message_broker_example"
path = "../../examples/message_broker_example.rs"

[[example]]
name = "message_broker_server"
path = "../../examples/message_broker_server.rs"


